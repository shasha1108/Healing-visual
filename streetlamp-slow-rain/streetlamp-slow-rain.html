<!DOCTYPE html>
<!--
  Title: Streetlamp Slow Rain · 路灯周围，雨会慢一点
  Concept: 按住末班车站的旧路灯，灯下的雨暂时失去时间；松手后，被延迟的雨重新追上世界。
  Tech: p5.js, Canvas 2D, Web Audio API
  Keywords: p5.js, canvas 2d, web audio api, touch interaction
  Features: Deterministic seeded pixel-art scene in p5.js: touching the lamp pulls rain into a time-debt that is repaid the moment you let go, while the butterfly dodges a tap. Procedural rain and lamp-hum audio retried on real touch when autoplay is blocked.
  Render: Canvas2D (p5.js)
  Audio: yes
  Touch: yes
  Particles: N/A
  Standalone: yes, single HTML file, 1 CDN dependencies
  Repo: https://github.com/shasha1108/healing-visual-lab
-->

<script>

const FIXED_SEED = 30082026;
const RAIN_COUNTS = Object.freeze({ far:78, mid:56, near:28 });

  vendingY:498,
  vendingW:52,
  vendingH:102,
  butterflyX:285,
  butterflyY:648,
  foregroundBaseY:960

const query = typeof location !== 'undefined' ? new URLSearchParams(location.search) : new URLSearchParams();

let stage;
let rainDrops = [];
let ripples = [];
let splashes = [];
let fogBands = [];
let windows = [];
let roadMarks = [];
let puddleShards = [];
let hydrangeaPetals = [];
let gardenStems = [];
let gardenLeaves = [];
let foregroundPlants = [];
let rollingHills = [];
let butterflies = [];
let butterflyPointer = { active:false, x:0, y:0, kind:'idle' };
let simTime = 0;
let qaTime = 0;

let camera = { x:0, targetX:0 };
let lamp;
let timeField;
let water;
let pointer;
let tapLinger = { active:false, elapsed:0, remaining:0 };
let worldState = 'QUIET';
let visitedStates = new Set(['QUIET']);
let butterflyQA = { exactHit:false, dodged:false, returned:false, released:false };
let interfaceState = { ready:false, guideVisible:true, interactionSeen:false, guide:null };

const audioState = {
  ctx:null, master:null,
  farSource:null, farFilter:null, farGain:null,
  nearSource:null, nearFilter:null, nearGain:null,
  humA:null, humB:null, humGainA:null, humGainB:null,
  sources:[], nodes:[], started:false, desired:true, blocked:false, hidden:false, requestId:0, lastUpdate:-1
};

function mulberry32(seed) {
  return function rng() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function range(rng, low, high) { return low + (high-low)*rng(); }
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function damp(value, target, rate, dt) { return value+(target-value)*(1-Math.exp(-rate*dt)); }
function smoothstep(edge0, edge1, x) { const t=clamp((x-edge0)/(edge1-edge0),0,1);return t*t*(3-2*t); }
function fillHex(g, hex, alpha=255) { const v=parseInt(hex.slice(1),16);g.fill((v>>16)&255,(v>>8)&255,v&255,alpha); }
function strokeHex(g, hex, alpha=255) { const v=parseInt(hex.slice(1),16);g.stroke((v>>16)&255,(v>>8)&255,v&255,alpha); }
function rgbHex(hex) { const v=parseInt(hex.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255]; }
function setWorldState(next) { if(worldState===next)return;worldState=next;visitedStates.add(next); }

class Butterfly {
  constructor(cx,cy,index,seed) {
    this.cx=cx;this.cy=cy;this.index=index;this.seed=seed;
    // Original flight envelope and Lissajous frequencies are intentionally retained.
    this.rx=55+index*28;this.ry=18+index*9;this.rz=28+index*13;
    this.sX=.38+index*.13;this.sY=.28+index*.09;this.sZ=.75+index*.17;
    this.color=[[130,200,255],[180,150,255],[100,255,200]][index];
    this.x=cx;this.y=cy;this.scale=.85;this.wingAngle=seed;this.dodgeX=0;this.dodgeY=0;
  }

  update(t,cx,cy,dt) {
    let px=Math.sin(t*this.sX+this.seed)*this.rx;
    let py=Math.cos(t*this.sY+this.seed)*this.ry;
    let pz=Math.sin(t*this.sZ+this.seed)*this.rz;
    // This is the source's paired low-frequency noise drift, kept at the original 38-unit amplitude.
    px+=(noise(t*.5,this.seed)-.5)*38;
    pz+=(noise(this.seed,t*.5)-.5)*38;
    this.x=this.cx+px;this.y=this.cy+py*.3-pz;
    this.scale=.55+(py+this.ry)/(this.ry*2)*.6;
    this.wingAngle=t*3+this.seed;
    if(cx>0){
      const d=Math.hypot(this.x-cx,this.y-cy);
      if(d<100){this.x+=(this.x-cx)*.35;this.y+=(this.y-cy)*.25;}
    }
    // Source behavior is zero exactly at the touch center. The decaying nudge makes that mobile case visible.
    this.dodgeX=damp(this.dodgeX,0,2.8,dt);this.dodgeY=damp(this.dodgeY,0,2.8,dt);
    this.x+=this.dodgeX;this.y+=this.dodgeY;
  }

  nudgeFrom(x,y) {
    let dx=this.x-x,dy=this.y-y;let d=Math.hypot(dx,dy);
    if(d<.75){const a=this.seed+this.index*2.17;dx=Math.cos(a);dy=Math.sin(a);d=1;}
    const amount=17+clamp(1-d/100,0,1)*12;
    const nextX=this.dodgeX+dx/d*amount,nextY=this.dodgeY+dy/d*amount,nextMagnitude=Math.hypot(nextX,nextY),cap=46;
    this.dodgeX=nextMagnitude>cap?nextX/nextMagnitude*cap:nextX;this.dodgeY=nextMagnitude>cap?nextY/nextMagnitude*cap:nextY;
  }

  draw(g) {
    g.push();g.translate(Math.round(this.x),Math.round(this.y));g.scale(this.scale);
    const flap=Math.abs(Math.cos(this.wingAngle)),w=12*(.3+flap*.7),h=18;
    const ctx=g.drawingContext;ctx.shadowColor=`rgb(${this.color[0]},${this.color[1]},${this.color[2]})`;ctx.shadowBlur=22;
    g.noStroke();g.fill(this.color[0],this.color[1],this.color[2],230);
    g.triangle(0,0,-w,-h*.8,-w*.5,h*.5);g.triangle(0,0,w,-h*.8,w*.5,h*.5);
    ctx.shadowBlur=0;g.fill(255,255,255,250);g.circle(0,0,3);g.pop();
  }

  bounds() {
    const wing=12*this.scale+2,top=18*.8*this.scale+2,bottom=18*.5*this.scale+2;
    return [[this.x-wing,this.y-top],[this.x+wing,this.y-top],[this.x-wing,this.y+bottom],[this.x+wing,this.y+bottom]];
  }
}

function setup() {
  const canvas=createCanvas(windowWidth,windowHeight);
  canvas.parent('canvas-container');
  pixelDensity(1);
  noSmooth();
  drawingContext.imageSmoothingEnabled=false;
  stage=createGraphics(BASE_W,BASE_H);
  stage.pixelDensity(1);
  stage.noSmooth();
  stage.drawingContext.imageSmoothingEnabled=false;
  initWorld(FIXED_SEED);
  updateView();
  bindPointerEvents(canvas.elt);
  initInterface();
  void attemptAmbientAudio(false);
  if(shotMode)activateShotState();
}

function windowResized() {
  resizeCanvas(windowWidth,windowHeight);
  pixelDensity(1);
  drawingContext.imageSmoothingEnabled=false;
  updateView();
  layoutInterface();
}

function initWorld(seed=FIXED_SEED) {
  const rng=mulberry32(seed);
  if(typeof noiseSeed==='function')noiseSeed(seed);
  simTime=0;qaTime=0;worldState='QUIET';visitedStates=new Set(['QUIET']);
  camera={x:0,targetX:0};
  lamp={x:GEOMETRY.lampX,y:GEOMETRY.lampHeadY,energy:0,targetEnergy:0,hold:0,flickerPhase:range(rng,0,Math.PI*2),touchCompression:0,state:'QUIET'};
  timeField={x:GEOMETRY.lampX,y:GEOMETRY.lampHeadY,radius:76,targetRadius:76,strength:0,targetStrength:0,releaseEnergy:0,releaseAge:99,minimumHold:0};
  water={basePhase:range(rng,0,Math.PI*2),reflectionEnergy:0};
  pointer={active:false,id:null,mode:null,x:0,y:0,downTime:0,contactTime:0};
  tapLinger={active:false,elapsed:0,remaining:0};
  butterflyPointer={active:false,x:0,y:0,kind:'idle'};
  ripples=[];splashes=[];
  rainDrops=createRainPool(rng,reducedMotion?REDUCED_RAIN_COUNTS:RAIN_COUNTS);
  fogBands=[];
  for(let i=0;i<16;i+=1)fogBands.push({x:range(rng,-100,BASE_W),y:range(rng,90,590),w:range(rng,100,260),h:range(rng,12,36),speed:range(rng,1.2,3.4),alpha:range(rng,4,13),phase:range(rng,0,Math.PI*2)});
  initDepthScenery(rng);
  roadMarks=[];
  for(let i=0;i<88;i+=1)roadMarks.push({x:range(rng,10,710),y:range(rng,690,940),w:range(rng,8,90),alpha:range(rng,8,24),phase:range(rng,0,Math.PI*2)});
  puddleShards=[];
  for(let i=0;i<54;i+=1){
    const vending=i%3===0;
    puddleShards.push({
      x:(vending?GEOMETRY.vendingX+GEOMETRY.vendingW*.5:GEOMETRY.lampX)+range(rng,-68,68),
      y:vending?range(rng,GEOMETRY.vendingY+GEOMETRY.vendingH+7,790):range(rng,GEOMETRY.gardenCenterY+GEOMETRY.gardenRadiusY+19,922),w:range(rng,9,58),h:rng()>.74?3:2,
      alpha:range(rng,14,54),cool:vending,phase:range(rng,0,Math.PI*2)
    });
  }
  initGardenEntities(rng);
}

function hash01(value) { const n=Math.sin(value*12.9898+78.233)*43758.5453;return n-Math.floor(n); }
function rollingHillY(hill,x) {
  return hill.base-Math.sin(x*hill.freqA+hill.phaseA)*hill.ampA-Math.sin(x*hill.freqB+hill.phaseB)*hill.ampB;
}
function wetShorelineY(x) {
  return GEOMETRY.wetShoreBaseY+Math.sin(x*.0107+.62)*10+Math.sin(x*.026-1.3)*5;
}
function gardenTopY(x) {
  const normalized=(x-GEOMETRY.lampX)/GEOMETRY.gardenRadiusX;
  if(Math.abs(normalized)>1)return null;
  return GEOMETRY.gardenCenterY-Math.sqrt(1-normalized*normalized)*GEOMETRY.gardenRadiusY*.78;
}
function gardenBottomY(x) {
  const normalized=(x-GEOMETRY.lampX)/GEOMETRY.gardenRadiusX;
  if(Math.abs(normalized)>1)return null;
  return GEOMETRY.gardenCenterY+6+Math.sqrt(Math.max(0,1-normalized*normalized))*GEOMETRY.gardenRadiusY*.62;
}
function isGardenIslandAt(x,y) {
  const top=gardenTopY(x);
  if(top===null)return false;
  const bottom=gardenBottomY(x);
  return y>=top&&y<=bottom;
}
function isWetSurfaceAt(x,y) { return !isGardenIslandAt(x,y)&&y>=wetShorelineY(x); }
function initDepthScenery(rng) {
  // Borrowed spatial principle from the user's Dreamcore Summer Rain: several low, slow horizon contours
  // create recession before the wet foreground begins. Their seeded phases keep this street's silhouette stable.
  rollingHills=[
    {base:462,ampA:12,ampB:7,freqA:.009, freqB:.021,phaseA:range(rng,0,6.28),phaseB:range(rng,0,6.28),color:'#0b1c2c',alpha:158},
    {base:516,ampA:15,ampB:8,freqA:.0105,freqB:.026,phaseA:range(rng,0,6.28),phaseB:range(rng,0,6.28),color:'#102b36',alpha:220},
    {base:585,ampA:13,ampB:6,freqA:.012, freqB:.031,phaseA:range(rng,0,6.28),phaseB:range(rng,0,6.28),color:'#0a1b22',alpha:238}
  ];
  windows=[];
  for(let i=0;i<24;i+=1){
    const x=range(rng,18,700),hill=rollingHills[i%2],y=rollingHillY(hill,x)+range(rng,4,30);
    windows.push({x,y,w:rng()>.7?4:2,h:rng()>.8?4:3,alpha:range(rng,8,25),lit:rng()>.84});
  }
}

// Source reuse: flower clustering and the three butterfly flight constants below are adapted from
// the user's own dreamcore-summer-rain (1).html. Positions are rescaled to this 720×960 stage.
function initGardenEntities(rng) {
  hydrangeaPetals=[];gardenStems=[];gardenLeaves=[];foregroundPlants=[];butterflies=[];
  const clusters=[
    {x:-42,y:-54,r:31,c:rgbHex(PALETTE.hydrangeaBlue),pass:'back'},
    {x:39,y:-54,r:32,c:rgbHex(PALETTE.hydrangeaViolet),pass:'back'},
    {x:-5,y:-70,r:29,c:rgbHex(PALETTE.hydrangeaCyan),pass:'back'},
    {x:-54,y:-24,r:30,c:rgbHex(PALETTE.hydrangeaCyan),pass:'front'},
    {x:0,y:-29,r:38,c:rgbHex(PALETTE.hydrangeaBlue),pass:'front'},
    {x:52,y:-23,r:29,c:rgbHex(PALETTE.hydrangeaViolet),pass:'front'}
  ];
  clusters.forEach((cluster,clusterIndex)=>{
    gardenStems.push({
      rootX:GEOMETRY.lampX+range(rng,-48,48),rootY:GEOMETRY.gardenCenterY+range(rng,0,11),
      tipX:GEOMETRY.lampX+cluster.x+range(rng,-6,6),tipY:GEOMETRY.gardenCenterY+cluster.y+cluster.r*.45,
      pass:cluster.pass,phase:range(rng,0,Math.PI*2)
    });
    for(let i=0;i<38;i+=1){
      // The source intentionally samples radial distance uniformly: dense centers make a hydrangea head, not loose confetti.
      const a=range(rng,0,Math.PI*2),d=rng()*cluster.r;
      hydrangeaPetals.push({
        cluster:clusterIndex,x:cluster.x+Math.cos(a)*d,y:cluster.y+Math.sin(a)*d*.8,
        size:range(rng,6,12),bright:1-d/cluster.r*.65,phase:range(rng,0,Math.PI*2),color:cluster.c,pass:cluster.pass
      });
    }
  });
  for(let i=0;i<34;i+=1){
    const side=i%2===0?-1:1;
    gardenLeaves.push({
      x:GEOMETRY.lampX+side*range(rng,12,72),y:GEOMETRY.gardenCenterY-range(rng,5,35),
      w:range(rng,15,31),h:range(rng,6,12),side,pass:i%3===0?'back':'front',phase:range(rng,0,Math.PI*2)
    });
  }
  for(let i=0;i<50;i+=1){
    const left=i<27;
    foregroundPlants.push({
      side:left?'left':'right',kind:rng()<.3?'fern':'blade',x:left?range(rng,-28,170):range(rng,550,747),
      base:GEOMETRY.foregroundBaseY+range(rng,-3,10),h:range(rng,64,196),w:range(rng,3,9),bend:left?range(rng,18,82):range(rng,-82,-18),phase:range(rng,0,Math.PI*2)
    });
  }
  for(let index=0;index<3;index+=1)butterflies.push(new Butterfly(GEOMETRY.butterflyX,GEOMETRY.butterflyY,index,range(rng,0,100)));
}

function createRainPool(rng, counts) {
  const drops=[];
  const specs={
    // Short, single-stroke slanted rain follows the user's Oxygen Chamber particle grammar.
    far:{count:counts.far,speed:[115,165],length:[5,9],thickness:1,alpha:[45,92],vx:[-13,-8],landing:[0,28]},
    mid:{count:counts.mid,speed:[175,245],length:[8,14],thickness:1,alpha:[76,145],vx:[-18,-11],landing:[12,132]},
    near:{count:counts.near,speed:[260,340],length:[13,21],thickness:1,alpha:[105,182],vx:[-25,-15],landing:[62,286]}
  };
  Object.keys(specs).forEach((layer,layerIndex)=>{
    const spec=specs[layer];
    for(let i=0;i<spec.count;i+=1){
      const drop={
        layer,layerIndex,x:range(rng,-20,BASE_W+20),y:range(rng,-120,GEOMETRY.roadTopY),
        baseSpeed:range(rng,spec.speed[0],spec.speed[1])*RAIN_SPEED,length:range(rng,spec.length[0],spec.length[1]),
        thickness:spec.thickness,alpha:range(rng,spec.alpha[0],spec.alpha[1]),vx:range(rng,spec.vx[0],spec.vx[1])*RAIN_SPEED,
        phase:range(rng,0,Math.PI*2),timeScale:1,timeDebt:0,slowAmount:0,releaseLag:0,releaseClock:99,
        impactEnergy:0,landingRange:spec.landing,landingY:GEOMETRY.roadTopY,surface:'water',landingMode:null,waterOffset:0,groundOffset:0,soilInset:0,spawnX:0,resetIndex:0,seed:Math.floor(range(rng,1,999999))
      };
      assignRainLanding(drop,true);drop.y=range(rng,-100,drop.landingY);drops.push(drop);
    }
  });
  return drops;
}

function expectedRainPoolSize() { const counts=reducedMotion?REDUCED_RAIN_COUNTS:RAIN_COUNTS;return counts.far+counts.mid+counts.near; }
function assignRainLanding(drop,reseed=false) {
  if(reseed||!drop.landingMode){
    const phase=hash01(drop.seed*1.73+drop.resetIndex*17.11);
    drop.landingMode=drop.layer!=='near'&&phase<.14?'ground':'water';
    drop.waterOffset=rangeFromDrop(drop,drop.landingRange[0],drop.landingRange[1]);
    drop.groundOffset=rangeFromDrop(drop,7,22);
    drop.soilInset=4+phase*8;
    drop.spawnX=drop.x;
  }
  const shore=wetShorelineY(drop.x),top=gardenTopY(drop.x),bottom=gardenBottomY(drop.x);
  if(top!==null&&bottom-top>2){drop.landingY=top+Math.min(drop.soilInset,bottom-top-1);drop.surface='soil';return;}

function bindPointerEvents(element) {

function worldPoint(event) { return {x:(event.clientX-view.x)/view.scale,y:(event.clientY-view.y)/view.scale}; }

function updateButterflies(dt) {

function onPointerDown(event) {
  event.preventDefault();

  if(butterfly){
    pointer={active:true,id:event.pointerId,mode:'butterfly',x:p.x,y:p.y,downTime:0,contactTime:0};
    butterflyPointer={active:true,x:p.x-camera.x*.64,y:p.y,kind:'touch'};

  }

function onPointerMove(event) {

  pointer.x=p.x;pointer.y=p.y;

function onPointerEnd(event) {

}

function onPointerAbort(event) {

}

function finishPointer(event,allowTap) {
  if(!pointer.active||(event.pointerId!==undefined&&event.pointerId!==pointer.id))return;

    if(allowTap&&duration<=TAP_MAX_SECONDS)beginTapLinger(pointer.downTime);

function onPointerLeave(event) {

function beginLampHold() {

  timeField.targetStrength=.13;timeField.targetRadius=92;timeField.minimumHold=.9;timeField.releaseAge=99;
  setWorldState('LISTEN');
}

function beginTapLinger(elapsed) {
  tapLinger={active:true,elapsed:Math.max(0,elapsed),remaining:TAP_LINGER_SECONDS};

function releaseLamp() {
  tapLinger.active=false;tapLinger.remaining=0;

  lamp.state='RELEASE';lamp.targetEnergy=0;lamp.hold=Math.max(lamp.hold,.9);
  timeField.releaseEnergy=peak;timeField.releaseAge=0;timeField.minimumHold=Math.max(timeField.minimumHold,.9);
  timeField.targetStrength=Math.max(.16,peak*.42);timeField.targetRadius=82;
  rainDrops.forEach(drop=>{
    const layerLag=drop.layer==='far'?0:drop.layer==='mid'?.12:.26;
    const radial=Math.hypot(drop.x-timeField.x,drop.y-timeField.y)/GEOMETRY.fieldMaxRadius;

    drop.releaseClock=0;

    // That makes a late, physical landing still answer the hold after its debt has been repaid.

function abortPointerInteraction() {

  if(pointer.active&&pointer.mode==='butterfly')butterflyPointer={active:false,x:0,y:0,kind:'idle'};
  pointer.active=false;pointer.id=null;pointer.mode=null;pointer.contactTime=0;camera.targetX=0;

function onWindowBlur() { abortPointerInteraction(); }
function onPageHide() {
  abortPointerInteraction();

  stopAllAudio(true);
}

function onPageShow() {
  audioState.hidden=false;

function activateShotState() {
  pointer={active:true,id:-1,mode:'lamp',x:GEOMETRY.lampX,y:GEOMETRY.lampHeadY,downTime:0};
  beginLampHold();
  for(let i=0;i<78;i+=1){pointer.downTime+=1/60;updateWorld(1/60);}
}

function updateWorld(dt) {
  dt=clamp(dt,0,.05);simTime+=dt;camera.x=damp(camera.x,camera.targetX,2.8,dt);
  const physicalHeld=isPhysicalLampHold();
  if(physicalHeld){
    pointer.downTime+=dt;pointer.contactTime=(pointer.contactTime||0)+dt;
  }
  if(tapLinger.active&&!physicalHeld){
    tapLinger.elapsed+=dt;tapLinger.remaining-=dt;
    if(tapLinger.remaining<=0){tapLinger.active=false;tapLinger.remaining=0;releaseLamp();}
  }
  const held=physicalHeld||tapLinger.active;
  const holdTime=physicalHeld?pointer.downTime:tapLinger.active?tapLinger.elapsed:0;
  if(held){
    const t=holdTime;
    if(t<.1){lamp.state='LISTEN';lamp.targetEnergy=.18;timeField.targetStrength=.13;timeField.targetRadius=92;setWorldState('LISTEN');}
    else if(t<.9){const p=smoothstep(.1,.9,t);lamp.state='SLOWING';lamp.targetEnergy=.34+.48*p;timeField.targetStrength=.18+.76*p;timeField.targetRadius=96+79*p;setWorldState('SLOWING');}
    else{lamp.state='SUSPENDED';lamp.targetEnergy=1;timeField.targetStrength=.965;timeField.targetRadius=GEOMETRY.fieldMaxRadius;setWorldState('SUSPENDED');}
    lamp.hold=Math.max(lamp.hold,.12);timeField.minimumHold=Math.max(timeField.minimumHold,.12);
  } else if(timeField.releaseAge<20){
    timeField.releaseAge+=dt;timeField.minimumHold=Math.max(0,timeField.minimumHold-dt);lamp.hold=Math.max(0,lamp.hold-dt);
    if(timeField.releaseAge<.25){timeField.targetStrength=Math.max(.08,timeField.releaseEnergy*(1-timeField.releaseAge/.25)*.28);timeField.targetRadius=78;setWorldState('RELEASE');}
    else if(timeField.minimumHold>0){timeField.targetStrength=.12*timeField.minimumHold/.9;timeField.targetRadius=78;}
    else{timeField.targetStrength=0;timeField.targetRadius=72;}
  }

  lamp.energy=damp(lamp.energy,lamp.targetEnergy,held?7.5:2.1,dt);
  lamp.touchCompression=damp(lamp.touchCompression,held?clamp(holdTime/.8,0,1):0,held?9:3.2,dt);
  timeField.strength=damp(timeField.strength,timeField.targetStrength,held?4.8:3.4,dt);
  timeField.radius=damp(timeField.radius,timeField.targetRadius,held?3.8:4.6,dt);
  water.reflectionEnergy=damp(water.reflectionEnergy,held?timeField.strength:timeField.releaseAge<1.5?timeField.releaseEnergy*.5:0,held?3:1.2,dt);

  let maxDebt=0;
  rainDrops.forEach(drop=>{

  updateRipples(dt);updateSplashes(dt);updateAudioState();

    else{lamp.state='QUIET';lamp.energy=0;lamp.targetEnergy=0;timeField.releaseEnergy=0;timeField.releaseAge=99;setWorldState('QUIET');}
  }
}

function updateRainDrop(drop,dt,held) {
  const dx=drop.x-timeField.x,dy=drop.y-timeField.y;
  const distance=Math.hypot(dx,dy);
  const radial=1-smoothstep(timeField.radius*.48,timeField.radius,distance);
  const fieldAmount=held?timeField.strength*radial:0;
  const desiredScale=clamp(1-fieldAmount*.965,.035,1);

  } else if(!held&&drop.timeDebt>0){
    drop.impactEnergy=Math.max(drop.impactEnergy,clamp(drop.timeDebt/MAX_TIME_DEBT,0,1));
    drop.releaseClock+=dt;
    if(drop.releaseClock>=drop.releaseLag){
      const boostCap=reducedMotion?.55:2.35;

      const repay=Math.min(drop.timeDebt,drop.baseSpeed*boost*dt);

      speed+=repay/Math.max(dt,.001);
    }
  }

  drop.x+=drop.vx*dt;
  drop.y+=speed*dt;
  // The target follows the drop's real lateral position; it never moves the drop itself vertically.
  assignRainLanding(drop);

    const catchup=!held&&drop.impactEnergy>.045;
    const strength=catchup?clamp(.38+drop.impactEnergy*.64,.38,1):drop.layer==='near'?.30:drop.layer==='mid'?.20:.12;
    if(drop.surface==='water'&&isWetSurfaceAt(drop.x,drop.landingY)){

      if(catchup&&drop.layer!=='far'&&!reducedMotion)spawnSplash(drop.x,drop.landingY,strength);
    }

  } else if(drop.x<-30){
    drop.x=BASE_W+20;drop.resetIndex+=1;assignRainLanding(drop,true);drop.y=clamp(drop.y,-80,drop.landingY-30);
  }
}

function resetRainDrop(drop) {

// Autoplay may reject the first page-load attempt. Every real pointer gesture calls this
// production path again; no "requested" latch can consume that later permission grant.
function attemptAmbientAudio(userGesture) {
  void userGesture;
  audioState.desired=true;
  if(audioState.hidden)return Promise.resolve(false);
  const AudioCtor=typeof window!=='undefined'&&(window.AudioContext||window.webkitAudioContext);
  if(!AudioCtor){audioState.blocked=true;return Promise.resolve(false);}
  let ctx;
  try{
    ctx=audioState.ctx;
    if(!ctx||ctx.state==='closed'){
      if(ctx)disposeAudioGraph(false);
      ctx=buildAudioGraph(AudioCtor);
    }
  }catch(_){
    audioState.blocked=true;
    return Promise.resolve(false);
  }
  const requestId=++audioState.requestId;
  const activate=()=>{
    if(requestId!==audioState.requestId||!audioState.desired||audioState.hidden||ctx!==audioState.ctx||ctx.state!=='running'){
      if(requestId===audioState.requestId&&ctx===audioState.ctx&&ctx.state!=='running')audioState.blocked=true;
      return false;
    }
    try{
      if(!audioState.started&&audioState.master){
        const now=ctx.currentTime;
        audioState.master.gain.cancelScheduledValues(now);
        audioState.master.gain.setValueAtTime(audioState.master.gain.value,now);
        audioState.master.gain.linearRampToValueAtTime(AUDIO_MASTER_LEVEL,now+2);
        audioState.started=true;
        audioState.lastUpdate=-1;
      }
      audioState.blocked=false;
      return true;
    }catch(_){return blocked();}
  };
  const blocked=()=>{
    if(requestId===audioState.requestId&&ctx===audioState.ctx)audioState.blocked=true;
    return false;
  };
  if(ctx.state==='running')return Promise.resolve(activate());
  if(typeof ctx.resume!=='function')return Promise.resolve(blocked());
  try{return Promise.resolve(ctx.resume()).then(activate,blocked);}catch(_){return Promise.resolve(blocked());}
}

  for(let i=0;i<length;i+=1)data[i]=(Math.random()*2-1)*amplitude;

function updateAudioState() {
  if(!audioState.started||!audioState.ctx||simTime-audioState.lastUpdate<.08)return;
  audioState.lastUpdate=simTime;
  const ctx=audioState.ctx,now=ctx.currentTime,held=isLampFieldActive();

  const nearCutoff=catchup?430:held?350-timeField.strength*155:350;
  const farLevel=catchup?.07:.06;
  const nearLevel=catchup?.16:held?Math.max(.03,.12-timeField.strength*.075):.12;
  audioState.farGain.gain.setTargetAtTime(farLevel,now,.12);
  audioState.nearFilter.frequency.setTargetAtTime(nearCutoff,now,.12);
  audioState.nearGain.gain.setTargetAtTime(nearLevel,now,.12);
  audioState.humGainA.gain.setTargetAtTime(.00045+lamp.energy*.00035,now,.16);
  audioState.humGainB.gain.setTargetAtTime(.00012+lamp.energy*.0001,now,.16);

function triggerReleaseBurst() {

function stopAllAudio(preserveIntent=false) {

function onVisibilityChange() {
  if(typeof document==='undefined')return;
  if(document.hidden){
    abortPointerInteraction();
    audioState.hidden=true;
    if(!audioState.ctx||typeof audioState.ctx.suspend!=='function')return;
    const suspendId=++audioState.requestId,ctx=audioState.ctx;
    try{
      Promise.resolve(ctx.suspend()).then(()=>{

    }catch(_){ }

  }

  updateWorld(dt);
  const dodgeDistance=Math.hypot(butterflies[0].dodgeX,butterflies[0].dodgeY);
  if(dodgeDistance>6)butterflyQA.dodged=true;
  if(qaTime>2&&dodgeDistance<1)butterflyQA.returned=true;
}
function worldContains(x,y) { return Number.isFinite(x)&&Number.isFinite(y)&&x>=0&&x<=BASE_W&&y>=0&&y<=BASE_H; }
function lampBounds() { return [[250,278],[318,278],[250,710],[318,710],[284,278],[284,710]]; }
</script>

<script type="application/pixel-bloom-qa">
globalThis.__PIXEL_BLOOM_QA__={
  horizonSeconds:12,dt:1/60,
  requiredStates:['QUIET','LISTEN','SLOWING','SUSPENDED','RELEASE','CATCHUP','SETTLING'],
  terminalStates:['QUIET'],
  reset(){resetWorldForQA();},
  begin(){triggerPrimaryInteractionForQA();},
  step(dt){updateWorldForQA(dt);},
  state(){return worldState;},
  entities(){return[{id:'streetlamp',points:lampBounds()},...butterflies.map((butterfly,index)=>({id:`butterfly-${index}`,points:butterfly.bounds()}))];},
  contains(x,y){return worldContains(x,y);},
  counts(){
    const checks=[{name:'rain-pool',expected:expectedRainPoolSize(),actual:rainDrops.length},{name:'butterfly-pool',expected:3,actual:butterflies.length}];
    if(qaTime>2.1)checks.push(
      {name:'butterfly-exact-touch',expected:1,actual:butterflyQA.exactHit?1:0},
      {name:'butterfly-dodge-return',expected:1,actual:butterflyQA.dodged&&butterflyQA.released&&butterflyQA.returned?1:0}
    );
    return checks;
  }
};
</script>
