function stagePointerDown(e){ensureAudio();if(e.target===capControl)return;if(world.mode==='OPEN_NIGHT'){let r=stage.getBoundingClientRect(),x=(e.clientX-r.left)*BASE_W/r.width,y=(e.clientY-r.top)*BASE_H/r.height;let nearest=fireflies.filter(f=>f.state==='OPEN').sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y)).slice(0,9);for(const f of nearest){f.energy=1;f.nudgeX+=(f.x-x)*.16;f.nudgeY+=(f.y-y)*.16}}}
function resetWorldForQA(){world=newWorld();world.mode='IDLE_SEALED';world.intro=1;world.visited=new Set(['INTRO','IDLE_SEALED']);initScene()}
function triggerPrimaryInteractionForQA(){world.cork=.6;world.pendingRelease=.001;setMode('CORK_LIFTING')}
function updateWorldForQA(dt){updateWorld(dt)}function advance(seconds){for(let i=0;i<Math.ceil(seconds*60);i++)updateWorld(1/60)}
function setup(){canvas=createCanvas(BASE_W,BASE_H);canvas.parent('pixel-stage');noSmooth();pixelDensity(1);drawingContext.imageSmoothingEnabled=false;backdrop=createGraphics(BASE_W,BASE_H);backdrop.noSmooth();backdrop.pixelDensity(1);backdrop.drawingContext.imageSmoothingEnabled=false;stage=document.getElementById('pixel-stage');capControl=document.getElementById('cap-control');hintEl=document.getElementById('hint');storyEl=document.getElementById('story-copy');aftercareEl=document.getElementById('aftercare');statusEl=document.getElementById('status');capControl.addEventListener('pointerdown',capPointerDown,{passive:false});capControl.addEventListener('pointermove',capPointerMove,{passive:false});capControl.addEventListener('pointerup',capPointerUp,{passive:false});capControl.addEventListener('pointercancel',capPointerUp,{passive:false});capControl.addEventListener('keydown',capKeyDown);stage.addEventListener('pointerdown',stagePointerDown,{passive:true});world=newWorld();initScene();sizeStage();let demo=params.get('demo');if(demo==='idle'){resetWorldForQA();world.demoFreeze=true}else if(demo==='release'){resetWorldForQA();triggerPrimaryInteractionForQA();advance(5.2);world.demoFreeze=true}else if(demo==='open'||params.get('opencork')==='1'){resetWorldForQA();triggerPrimaryInteractionForQA();advance(13);world.demoFreeze=true}if(params.get('shot')==='1'){hintEl.classList.add('yield');storyEl.classList.add('yield')}}
function windowResized(){sizeStage()}
</script>
<script type="application/pixel-bloom-qa">
globalThis.__PIXEL_BLOOM_QA__={horizonSeconds:16,dt:1/60,requiredStates:["IDLE_SEALED","CORK_LIFTING","RELEASE_BURST","OPEN_NIGHT"],terminalStates:["OPEN_NIGHT"],reset(){resetWorldForQA()},begin(){capPointerDown({preventDefault(){},stopPropagation(){}})},step(dt){updateWorldForQA(dt)},state(){return world.mode},entities(){return fireflies.map(function(f){let outside=f.state==='ESCAPING'||f.state==='OPEN',r=outside?Math.max(2,f.size*1.8*(f.tier===0?1.48:1)):.35;return{id:'firefly-'+f.id,points:[[f.x-r,f.y-r],[f.x+r,f.y-r],[f.x-r,f.y+r],[f.x+r,f.y+r]],allowEscape:outside,escapeReason:outside?'cork lifted':''}})},contains(x,y){return pointInBottle(x,y,0)},counts(){let outside=fireflies.filter(f=>f.state==='ESCAPING'||f.state==='OPEN'),visible=outside.filter(f=>{let r=Math.max(2,f.size*1.8*(f.tier===0?1.48:1));return f.x-r>=0&&f.x+r<=BASE_W&&f.y-r>=0&&f.y+r<=BASE_H}).length;return[{name:'fireflies',expected:FIREFLY_COUNT,actual:fireflies.length},{name:'outside-fireflies-visible',expected:outside.length,actual:visible},{name:'opened-open-night',expected:world.mode==='OPEN_NIGHT'?FIREFLY_COUNT:world.settledCount,actual:world.settledCount}]}};
</script>
