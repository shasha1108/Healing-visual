<script type="module">
import * as THREE from 'three';

/* ================= 确定性 ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260819);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const smooth=t=>t*t*(3-2*t);

/* ================= 色板 ================= */
const PALETTE={name:'Peachy Qixi',role:'浪漫喜剧夜景',colors:{
  skyTop:'#171044',skyMid:'#4a277a',skyBottom:'#ba4f83',
  water:'#342a83',waterDeep:'#201958',waterHi:'#ffb1cc',waterMoon:'#ffd98d',
  moon:'#ffe4a1',moonGlow:'#ffc76f',
  cloud:'#7654a8',cloudLit:'#dc83b4',
  brick:'#d96f91',brickTop:'#ffc06f',
  hero:'#44d7e8',heroPants:'#3754aa',
  niulang:'#4e78cc',niulangRobe:'#244d9a',
  zhinu:'#ff7fa5',zhinuRobe:'#cb4f96',
  dog:'#e9a45c',magpie:'#151a36',magpieWing:'#f9f4e8'
}};

/* ================= 渲染器 ================= */
let renderer;
try{
renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
}catch(e){
  document.getElementById('fallback').style.display='flex';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=makeSkyTexture();
scene.fog=new THREE.Fog(0x4a277a,17,34);

const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,60);
camera.position.set(0,3.2,13);
camera.lookAt(0,2.6,0);
function layout(){
  const aspect=innerWidth/innerHeight;
  const halfH=aspect>=1?5.35:clamp(3.35/aspect,5.7,7.15);
  const halfW=halfH*aspect;
  const centerX=aspect<.8?.28:0;
  camera.left=-halfW+centerX;camera.right=halfW+centerX;camera.top=halfH;camera.bottom=-halfH;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',layout);

function makeSkyTexture(){
  const c=document.createElement('canvas');c.width=2;c.height=256;
  const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,PALETTE.colors.skyTop);
  grad.addColorStop(.5,PALETTE.colors.skyMid);
  grad.addColorStop(.78,'#81417f');
  grad.addColorStop(1,PALETTE.colors.skyBottom);
  g.fillStyle=grad;g.fillRect(0,0,2,256);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}

/* ================= 灯光 ================= */
scene.add(new THREE.AmbientLight(0xb8a6ff,1.35));
const moonLight=new THREE.DirectionalLight(0xffdf9b,1.45);
moonLight.position.set(4,8,6);
scene.add(moonLight);

/* ================= 几何工具 ================= */
const MAT={};
function mat(color){ if(!MAT[color]) MAT[color]=new THREE.MeshLambertMaterial({color}); return MAT[color]; }
function box(w,h,d,color,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
  m.position.set(x,y,z);return m;
}
// 世界几何常量（唯一权威）
const WATER_Y=0;
const BRIDGE_HALF=5;
const deckY=x=>1.15+1.05*Math.cos(x/BRIDGE_HALF*Math.PI/2);
const deckAngle=x=>Math.atan(-1.05*Math.sin(x/BRIDGE_HALF*Math.PI/2)*(Math.PI/2/BRIDGE_HALF));

/* ================= 远景：星、月、云、水 ================= */
// 少量远星：只做空间层次，不与主体争抢注意力
{
  const n=48,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    pos[i*3]=(rng()-.5)*36; pos[i*3+1]=2.5+rng()*9; pos[i*3+2]=-8-rng()*6;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffefd0,size:.045,transparent:true,opacity:.7})));
}
// 月亮 + 光晕
const moon=new THREE.Mesh(new THREE.CircleGeometry(.95,40),new THREE.MeshBasicMaterial({color:PALETTE.colors.moon}));
moon.position.set(2.3,5.3,-7);scene.add(moon);
{
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(64,64,8,64,64,64);
  grad.addColorStop(0,'rgba(245,233,200,.55)');grad.addColorStop(1,'rgba(245,233,200,0)');
  g.fillStyle=grad;g.fillRect(0,0,128,128);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthWrite:false,transparent:true}));
  sp.scale.set(6,6,1);sp.position.copy(moon.position);sp.position.z-=0.5;scene.add(sp);
}
// 体素祥云：小模块构成云头与卷尾，避免大矩形堆叠
function makeCloud(scale=1,lit=PALETTE.colors.cloudLit){
  const g=new THREE.Group();
  const add=(w,h,d,color,x,y,z,opacity)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color,transparent:true,opacity}));
    m.position.set(x,y,z);g.add(m);
  };
  [[-.62,0,.42,.2],[-.2,.02,.5,.24],[.25,.02,.48,.24],[.62,0,.32,.18]].forEach(([x,y,w,h])=>add(w,h,.52,PALETTE.colors.cloud,x,y,0,.72));
  [[-.45,.18,.34,.22],[-.08,.27,.44,.28],[.32,.18,.36,.22]].forEach(([x,y,w,h])=>add(w,h,.55,lit,x,y,.02,.78));
  // 祥云卷尾和一条克制的金色月光边
  add(.34,.11,.48,PALETTE.colors.cloud,.88,-.04,0,.7);
  add(.18,.11,.46,PALETTE.colors.cloud,1.12,-.04,0,.66);
  add(.18,.09,.45,lit,.91,.1,.02,.72);
  add(.96,.035,.56,'#f4bd76',-.05,-.13,.015,.42);
  g.scale.setScalar(scale);return g;
}
const clouds=[];
[[-5.5,5.45,-4,.96],[5.65,6.15,-5,.8],[-3.45,6.7,-6,.58]].forEach(([x,y,z,s],i)=>{
  const c=makeCloud(s);c.position.set(x,y,z);c.userData={x0:x,speed:.06+rng()*.05,phase:rng()*9};
  clouds.push(c);scene.add(c);
});
// 河面：正对镜头的纵向水幕从水线一直铺到屏幕外，顶部透明淡入夜色，避免水平地板被压成分割带。
function makeWaterTexture(){
  const c=document.createElement('canvas');c.width=16;c.height=256;
  const g=c.getContext('2d'),grad=g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'rgba(88,66,141,0)');grad.addColorStop(.09,'rgba(76,58,134,.78)');
  grad.addColorStop(.25,PALETTE.colors.water);grad.addColorStop(.72,PALETTE.colors.waterDeep);grad.addColorStop(1,'#181441');
  g.fillStyle=grad;g.fillRect(0,0,c.width,c.height);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
const water=new THREE.Mesh(new THREE.PlaneGeometry(44,12),new THREE.MeshBasicMaterial({map:makeWaterTexture(),transparent:true,depthWrite:false}));
water.position.set(0,-5,-1.5);water.renderOrder=-10;scene.add(water);
const shimmer=[];
for(let i=0;i<18;i++){
  const moonBand=i<6,depth=i%6;
  const y=-.12-depth*.35-(moonBand?0:rng()*.35);
  const s=box(moonBand?.58+depth*.24:1.1+rng()*1.5,.025,.025,moonBand?PALETTE.colors.waterMoon:PALETTE.colors.waterHi,(moonBand?1.05+(depth-2.5)*.16:(rng()-.5)*13),y,-1.32);
  s.material=new THREE.MeshBasicMaterial({color:moonBand?PALETTE.colors.waterMoon:PALETTE.colors.waterHi,transparent:true,opacity:moonBand?.2:.1,depthWrite:false});
  s.renderOrder=-9;
  s.userData={x0:s.position.x,y0:y,speed:.16+rng()*.15,phase:rng()*7,amp:.18+rng()*.24,opacity:moonBand?.2:.1};
  shimmer.push(s);scene.add(s);
}
// 涟漪池
const ripples=[];
for(let i=0;i<8;i++){
  const r=new THREE.Mesh(new THREE.RingGeometry(.3,.38,24),new THREE.MeshBasicMaterial({color:0x8a9fd0,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  r.rotation.x=-Math.PI/2;r.position.y=WATER_Y+.02;r.visible=false;
  ripples.push({mesh:r,t0:-1,x:0,z:0});scene.add(r);
}
let rippleIdx=0;
function fireRipple(x,z,t){const r=ripples[rippleIdx++%ripples.length];r.t0=t;r.x=x;r.z=z;r.mesh.visible=true;}
// 水花粒子池
const splashes=[];
for(let i=0;i<26;i++){
  const m=box(.11,.11,.11,0x9fb8e8);m.visible=false;scene.add(m);
  splashes.push({mesh:m,t0:-1,x:0,z:0,vx:0,vy:0,vz:0});
}
let splashIdx=0,splashEventIdx=0;
function visualHash(n){
  const x=Math.sin(n*12.9898+20260819*.001)*43758.5453123;
  return x-Math.floor(x);
}
function fireSplash(x,z,t,power=1){
  const event=splashEventIdx++;
  for(let k=0;k<7;k++){
    const s=splashes[splashIdx++%splashes.length];
    s.t0=t;s.x=x;s.z=z;
    const a=visualHash(event*11+k)*Math.PI*2,v=(1.2+visualHash(event*11+k+31)*1.6)*power;
    s.vx=Math.cos(a)*v*.5;s.vz=Math.sin(a)*v*.5;s.vy=(2.2+visualHash(event*11+k+67)*1.4)*power;
    s.mesh.visible=true;
  }
  fireRipple(x,z,t);
}

/* ================= 鹊桥 ================= */
const bricks=[];
{
  const n=21;
  for(let i=0;i<n;i++){
    const x=-BRIDGE_HALF+ (i/(n-1))*BRIDGE_HALF*2;
    const b=box(.5,.32,1.1,PALETTE.colors.brick,x,deckY(x),0);

/* ================= 音频（Web Audio 合成） ================= */
let actx=null,master=null,muted=false;
function ensureAudio(){
  if(muted)return;
  if(!actx){
    try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){muted=true;return;}
    master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
    master.gain.linearRampToValueAtTime(.5,actx.currentTime+.8);
  }
  if(actx.state==='suspended')actx.resume();
}
function tone(freq,dur,{type='sine',gain=.2,slide=0,delay=0}={}){
  if(!actx||muted)return;
  const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noiseHit(dur,{freq=600,gain=.25,delay=0,slideTo=0}={}){
  if(!actx||muted)return;
  const t=actx.currentTime+delay;
  const len=Math.floor(actx.sampleRate*dur);
  const buf=actx.createBuffer(1,len,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=actx.createBufferSource();src.buffer=buf;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq,t);
  if(slideTo)f.frequency.linearRampToValueAtTime(slideTo,t+dur);
  const g=actx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t);
}
const SFX={
  thud(){tone(120,.2,{gain:.5,slide:-70});noiseHit(.14,{freq:320,gain:.3});},
  splash(d=0){noiseHit(.5,{freq:1000,gain:.28,delay:d,slideTo:220});tone(220,.25,{gain:.12,slide:-120,delay:d});},
  sparkle(d=0){[660,880,1320].forEach((f,i)=>tone(f,.12,{gain:.1,delay:d+i*.07}));},
  chirp(d=0){tone(2400,.06,{type:'square',gain:.07,delay:d});tone(2900,.05,{type:'square',gain:.06,delay:d+.09});},
  bark(d=0){tone(280,.09,{type:'sawtooth',gain:.28,delay:d});tone(240,.1,{type:'sawtooth',gain:.26,delay:d+.14});},
  plop(d=0){tone(520,.08,{gain:.14,slide:280,delay:d});},
  rewind(){noiseHit(.35,{freq:400,gain:.18,slideTo:2400});},
  step(d=0){tone(700,.04,{type:'square',gain:.05,delay:d});}
};

function updateAmbient(t){

  shimmer.forEach(s=>{

// 涟漪与水花用全局钟（stateTime 在分支内会清零）
let globalT=0;
function updateParticles(){
  ripples.forEach(r=>{
    if(r.t0<0)return;
    const age=globalT-r.t0;
    if(age>1.6){r.mesh.visible=false;r.t0=-1;return;}
    r.mesh.position.x=r.x;r.mesh.position.z=r.z;
    r.mesh.scale.setScalar(1+age*2.2);

  });

    if(!s.mesh.visible)return;
    s.mesh.position.set(s.x+s.vx*age,WATER_Y+.05+s.vy*age-4.9*age*age,s.z+s.vz*age);
  });
}

/* ================= 主循环 ================= */
const BRANCH_UPDATERS={INTRO:updateIntro,DOG:updateDog,DEMOLISH:updateDemolish,MAGPIE:updateMagpie,INFRASTRUCTURE:updateInfrastructure,CHOICE:(t)=>coupleIdle(t)};
function step(dt){
  globalT+=dt;stateTime+=dt;
  updateAmbient(globalT);
  BRANCH_UPDATERS[state](stateTime);
  updateParticles();
}
function frame(ts){
  if(!animationRunning){rafId=0;return;}
  const dt=clamp((ts-lastTs)/1000,0,1/30);lastTs=ts;
  step(dt);
  renderer.render(scene,camera);
  rafId=requestAnimationFrame(frame);
}
function startLoop(){
  if(animationRunning)return;
  animationRunning=true;lastTs=performance.now();rafId=requestAnimationFrame(frame);
}
function stopLoop(){
  animationRunning=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=0;}
}
const SHOT_TIMES={dog:9.3,demolish:6.0,magpie:8.4,infrastructure:5.35};
function seekBranch(branch,targetTime,{step:fixedStep=1/60,shot=false}={}){
  if(!ALL_BRANCHES.includes(branch))throw new Error(`Unknown branch: ${branch}`);
  const target=Math.max(0,Number(targetTime)||0);
  const dt=clamp(Number(fixedStep)||1/60,1/240,1/15);
  stopLoop();renderMode=true;document.documentElement.classList.add('render-mode');startBranch(branch,{silent:true});
  const wholeSteps=Math.floor((target+1e-9)/dt);
  for(let i=0;i<wholeSteps;i++)step(dt);
  const remainder=target-wholeSteps*dt;
  if(remainder>1e-9)step(remainder);
  syncTestOverlays(branch,stateTime);
  if(shot){
    if(!endingCard.classList.contains('show'))showCaption();
    endingCard.classList.add('render-static');
  }
  renderer.render(scene,camera);
  return {branch,time:stateTime,state,canvas:renderer.domElement};
}

function roundRect(ctx,x,y,w,h,r){
  const radius=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+radius,y);ctx.arcTo(x+w,y,x+w,y+h,radius);ctx.arcTo(x+w,y+h,x,y+h,radius);ctx.arcTo(x,y+h,x,y,radius);ctx.arcTo(x,y,x+w,y,radius);ctx.closePath();
}
function wrapText(ctx,text,x,y,maxWidth,{weight=400,size=24,minSize=18,maxLines=2,color='#fff8df',lineGap=1.22}={}){
  const fontFamily='PingFang SC, Microsoft YaHei, sans-serif';
  const makeLines=()=>{
    const lines=[];let line='';
    for(const char of text){
      const test=line+char;
      if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=char;}else line=test;
    }
    if(line)lines.push(line);return lines;
  };
  while(size>minSize){ctx.font=`${weight} ${size}px ${fontFamily}`;if(makeLines().length<=maxLines)break;size-=2;}
  ctx.font=`${weight} ${size}px ${fontFamily}`;ctx.fillStyle=color;
  const lines=makeLines(),lineHeight=Math.round(size*lineGap);
  lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));
  return {y:y+lines.length*lineHeight,size,lines};
}

  const source=renderer.domElement;
  const cropH=Math.min(source.height,source.width*sceneHeight/width),cropY=Math.max(0,(source.height-cropH)*.28);
  const cropW=cropH*width/sceneHeight,cropX=Math.max(0,(source.width-cropW)/2);
  ctx.save();ctx.beginPath();ctx.rect(0,0,width,sceneHeight);ctx.clip();ctx.drawImage(source,cropX,cropY,cropW,cropH,0,0,width,sceneHeight);ctx.restore();
  const panelY=sceneHeight;ctx.fillStyle='#251754';ctx.fillRect(0,panelY,width,height-sceneHeight);
  ctx.fillStyle='#ffd98c';ctx.font='700 22px PingFang SC, Microsoft YaHei, sans-serif';ctx.fillText('七夕 · 鹊桥现场小报',58,panelY+58);
  ctx.fillStyle='rgba(255,218,133,.35)';ctx.fillRect(58,panelY+84,width-116,2);
  let y=panelY+132;
  y=wrapText(ctx,r.title,58,y,width-116,{weight:800,size:43,minSize:30,maxLines:2,color:'#fff8df',lineGap:1.18}).y+20;
  y=wrapText(ctx,r.caption,58,y,width-116,{weight:700,size:29,minSize:22,maxLines:2,color:'#fff1dc',lineGap:1.25}).y+15;
  y=wrapText(ctx,r.detail,58,y,width-116,{weight:400,size:23,minSize:18,maxLines:2,color:'#ffd9de',lineGap:1.3}).y+20;
  const stampY=Math.min(y,height-125);
  ctx.fillStyle='#ffd26f';ctx.font='800 24px PingFang SC, Microsoft YaHei, sans-serif';roundRect(ctx,58,stampY,width-116,54,12);ctx.strokeStyle='#ffd26f';ctx.lineWidth=3;ctx.stroke();ctx.fillText(r.stamp,80,stampY+36);
  ctx.fillStyle='#cdb9ed';ctx.font='400 20px PingFang SC, Microsoft YaHei, sans-serif';ctx.fillText(`${r.code}  ·  七夕事故图鉴 ${normalEndingCount()}/3`,58,height-48);
  canvas.toBlob(blob=>{
    if(!blob){showToast('图片暂时没保存成功');return;}
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`qixi-report-${currentBranch}-3x4.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('3:4 事故报告已保存');
  },'image/png');
}
saveReportBtn.addEventListener('click',saveReportImage);
// 屏幕三分区点选
addEventListener('pointerdown',e=>{
  ensureAudio();
  if(state!=='CHOICE')return;
  if(e.target.closest('#choice-panel')||e.target.closest('#again'))return;
  const third=Math.floor(e.clientX/innerWidth*3);
  pick(['dog','demolish','magpie'][clamp(third,0,2)]);
});
addEventListener('keydown',e=>{
  if(state!=='CHOICE')return;
  if(e.key==='1')pick('dog');if(e.key==='2')pick('demolish');if(e.key==='3')pick('magpie');
});

/* ================= 启动与测试钩子 ================= */
layout();
updateCollection();
window.__qixiRender=Object.freeze({
  seek(branch,t,options={}){
    if(!LOCAL_RENDER_BRANCHES.has(branch))throw new Error('seek only supports magpie and infrastructure');
    return seekBranch(branch,t,options);
  },
  render(){stopLoop();renderer.render(scene,camera);return renderer.domElement;},
  stop:stopLoop
});
const autoBranch=params.get('branch');
const tParam=parseFloat(params.get('t')||'');
const shotMode=params.get('shot')==='1';
const renderRequested=params.get('render')==='1';
if(params.get('nointro')==='1'){resetWorld();showChoice();}
if(autoBranch&&ALL_BRANCHES.includes(autoBranch)){
  if(!isNaN(tParam)||shotMode||renderRequested){
    seekBranch(autoBranch,!isNaN(tParam)?tParam:SHOT_TIMES[autoBranch],{shot:shotMode});
  }else{
    renderMode=false;startBranch(autoBranch);startLoop();
  }
}else if(renderRequested){
  renderMode=true;document.documentElement.classList.add('render-mode');resetWorld();showChoice();renderer.render(scene,camera);
}else{
  // 冷开场
  startLoop();
}
</script>
</body>
</html>
